
server:
  port: ${SERVER_PORT:4000}
  shutdown: "graceful"

management:
  endpoint:
    health:
      show-details: "always"
      # Enable the readiness group when database health checks are configured.
      # group:
      #   readiness:
      #     include: "db"
  endpoints:
    web:
      base-path: /
      exposure:
        include: info

springdoc:
  packagesToScan: uk.gov.hmcts.reform.dev.controllers
  writer-with-order-by-keys: true

spring:
  config:
    import: "optional:configtree:/mnt/secrets/test/"

  application:
    name: Dev Test

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}${DB_OPTIONS:}
    username: ${DB_USER_NAME}
    password: ${DB_PASSWORD}
    properties:
      charSet: UTF-8
    hikari:
      minimumIdle: 2
      maximumPoolSize: 10
      idleTimeout: 10000
      poolName: HmctsTaskManagerHikariCP
      maxLifetime: 7200000
      connectionTimeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
